<span class="text-[10px] text-on-surface-variant uppercase tracking-widest font-medium">Intimate Connection</span>
</div>
</div>
</div>
</div>
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:bg-[#2c2c2c] p-2 rounded-full transition-colors active:scale-95 duration-150">

</button>

<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</header>

</div>
<span class="text-[10px] text-on-surface-variant ml-2">刚刚</span>
</div>
</div>
<!-- User Message -->
<div class="flex flex-col items-end gap-1.5 ml-auto max-w-[85%]">
<div class="bg-secondary-container text-on-secondary-container p-4 rounded-lg rounded-br-sm neon-glow">
<p class="text-body-lg leading-relaxed font-body">
                    跟我说说那个半个世纪前的秘密吧。

<span class="italic text-secondary opacity-90">*眼神中闪过一丝复杂的情绪，低头看向酒杯*</span> 那个秘密... 恐怕比这杯酒还要浓烈。

</div>
<div class="flex items-center gap-2 mt-1">

</div>
</div>
</div>

<!-- Bottom Input Bar (BottomNavBar Hybrid) -->
<footer class="fixed bottom-0 left-0 w-full z-50 px-6 pb-8 pt-4 bg-[#0e0e0e]/60 backdrop-blur-3xl">

</button>
</div>

<span class="material-symbols-outlined" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
</footer>
<!-- Background Atmospheric Elements (Editorial Aesthetic) -->
<div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-secondary/5 blur-[120px] rounded-full"></div>
<div class="absolute top-[40%] -right-[10%] w-[30%] h-[50%] bg-primary-container/5 blur-[100px] rounded-full"></div>
<div class="absolute bottom-0 left-0 w-full h-[30%] bg-gradient-to-t from-background to-transparent"></div>
</div>
</body></html>
