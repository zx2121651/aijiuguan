<!DOCTYPE html>

<html class="dark" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#0e0e0e",
                        "on-tertiary": "#00645a",
                        "on-secondary-fixed-variant": "#6834a6",
                        "on-primary-container": "#563e00",
                        "error-dim": "#d53d18",
                        "primary-dim": "#eeb200",
                        "on-secondary-container": "#e1c5ff",
                        "secondary-dim": "#ba85fb",
                        "secondary-fixed-dim": "#d7b5ff",
                        "outline-variant": "#484847",
                        "surface-container-high": "#20201f",
                        "tertiary": "#a0fff0",
                        "on-surface-variant": "#adaaaa",
                        "surface-container": "#1a1a1a",
                        "surface-bright": "#2c2c2c",
                        "on-tertiary-fixed": "#00463f",
                        "on-secondary": "#340064",
                        "outline": "#767575",
                        "tertiary-fixed-dim": "#33e9d5",
                        "tertiary-container": "#4af8e3",
                        "secondary-container": "#5e289b",
                        "surface-variant": "#262626",
                        "surface-tint": "#ffd16f",
                        "primary": "#ffd16f",
                        "surface-container-lowest": "#000000",
                        "on-primary-fixed-variant": "#614700",
                        "error-container": "#b92902",
                        "inverse-primary": "#7a5a00",
                        "on-surface": "#ffffff",
                        "on-error": "#450900",
                        "on-tertiary-fixed-variant": "#00655b",
                        "inverse-on-surface": "#565555",
                        "inverse-surface": "#fcf9f8",
                        "on-primary-fixed": "#3d2b00",
                        "primary-fixed-dim": "#eeb200",
                        "primary-fixed": "#ffbf00",
                        "background": "#0e0e0e",
                        "error": "#ff7351",
                        "tertiary-dim": "#2de7d2",
                        "on-background": "#ffffff",
                        "secondary": "#bc87fe",
                        "surface-container-low": "#131313",
                        "surface-container-highest": "#262626",
                        "primary-container": "#ffbf00",
                        "surface-dim": "#0e0e0e",
                        "tertiary-fixed": "#4af8e3",
                        "on-tertiary-container": "#005b51",
                        "secondary-fixed": "#e2c7ff",
                        "on-secondary-fixed": "#4a0b87",
                        "on-primary": "#614700",
                        "on-error-container": "#ffd2c8"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans", "Noto Sans SC"],
                        "body": ["Be Vietnam Pro", "Noto Sans SC"],
                        "label": ["Be Vietnam Pro", "Noto Sans SC"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0e0e0e;
            font-family: 'Be Vietnam Pro', 'Noto Sans SC', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }
        .text-neon-glow {
            text-shadow: 0 0 10px rgba(255, 191, 0, 0.4), 0 0 20px rgba(255, 191, 0, 0.2);
        }
        .glass-panel {
            background: rgba(14, 14, 14, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .portrait-mask {
            mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-16 w-full bg-[#0e0e0e]/60 backdrop-blur-xl shadow-[0_0_40px_rgba(188,135,254,0.06)]">
<div class="flex items-center gap-4">
<button class="text-[#ffd16f] hover:bg-white/10 transition-colors active:scale-95 duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] font-bold tracking-tight text-xl text-[#ffd16f]">Character Profile</h1>
</div>
<button class="text-[#ffd16f] hover:bg-white/10 transition-colors active:scale-95 duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="share">share</span>
</button>
</header>
<main class="relative min-h-screen pb-32">
<!-- Main Visual: Cinematic Portrait -->
<section class="relative w-full h-[530px] overflow-hidden">
<div class="absolute inset-0 portrait-mask">
<img class="w-full h-full object-cover object-top" data-alt="Cinematic portrait of a mysterious elegant woman in a modern black silk cheongsam, rainy night neon city lights background, atmospheric lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBQvYnMJOhW9wv5NUw8xnImBI91cp96Wk3QYUdRPnvuDYHSBIcd1ak4hRE0j2G65PdejIcabOhoHyI1ksSM8BXEyWNG4SAD12esw73kr4srf9tEsm8dvWCKgYTEuoicRwzdfqOBtyOW-5Q-QNgQhohD94NIh8sKUuw6WoO86I-VzR7_628jKDKU28poj8e0PfD69ZUFWmp5AVEgwxK1yfHttW6ok01zYtKqsMliXrkvobaD8AoxKao8K1kfmJ0ghbfjjLB5TkwQ1byu"/>
</div>
<!-- Gradient Overlay for transition -->
<div class="absolute bottom-0 left-0 w-full h-32 bg-gradient-to-t from-surface to-transparent"></div>
</section>
<!-- Content Section -->
<section class="relative -mt-24 px-6 z-10">
<!-- Name & Identity -->
<div class="glass-panel p-8 rounded-lg shadow-[0_0_40px_rgba(188,135,254,0.06)] border border-white/5">
<div class="flex flex-col gap-2">
<h2 class="font-headline font-extrabold text-4xl text-primary text-neon-glow tracking-tight">苏婉 (Su Wan)</h2>
<!-- Personality Tags -->
<div class="flex flex-wrap gap-2 mt-4">
<span class="px-4 py-1.5 bg-surface-container rounded-full text-sm font-medium text-tertiary border border-tertiary/10">神秘</span>
<span class="px-4 py-1.5 bg-surface-container rounded-full text-sm font-medium text-secondary border border-secondary/10">冷艳</span>
<span class="px-4 py-1.5 bg-surface-container rounded-full text-sm font-medium text-primary border border-primary/10">故事</span>
</div>
</div>
<!-- Story Section -->
<div class="mt-10 space-y-4">
<div class="flex items-center gap-2 text-on-surface-variant uppercase tracking-widest text-xs font-bold">
<span class="w-8 h-[1px] bg-outline-variant"></span>
                        背景故事
                    </div>
<p class="font-body text-lg leading-relaxed text-on-surface/90">
                        在霓虹闪烁的酒馆尽头，苏婉静静地坐着。她的眼神里藏着半个世纪的秘密，每一杯调制的酒都仿佛是一个未完待续的故事。
                    </p>
</div>
<!-- Affinity / Progress Section -->
<div class="mt-10 p-6 bg-surface-container-lowest rounded-lg border border-white/5">
<div class="flex justify-between items-end mb-3">
<div class="flex flex-col">
<span class="text-on-surface-variant text-xs font-bold uppercase tracking-widest">好感度</span>
<span class="text-primary font-headline font-bold text-2xl">Lvl. 4</span>
</div>
<span class="text-primary font-headline font-bold">65%</span>
</div>
<!-- Neon Amber Progress Bar -->
<div class="w-full h-2.5 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-primary to-primary-container shadow-[0_0_15px_rgba(255,191,0,0.5)]" style="width: 65%;"></div>
</div>
<p class="mt-4 text-xs text-on-surface-variant italic">
                        “这里的酒很烈，你的心事也很重。”
                    </p>
</div>
</div>
<!-- Interaction Features / Bento Grid Style -->
<div class="mt-6 grid grid-cols-2 gap-4">
<div class="bg-surface-container-low p-6 rounded-lg flex flex-col gap-3">
<span class="material-symbols-outlined text-secondary" data-icon="auto_awesome">auto_awesome</span>
<span class="font-bold text-sm">专属回忆</span>
<span class="text-xs text-on-surface-variant">解锁 3/12 个章节</span>
</div>
<div class="bg-surface-container-low p-6 rounded-lg flex flex-col gap-3">
<span class="material-symbols-outlined text-tertiary" data-icon="restaurant_menu">restaurant_menu</span>
<span class="font-bold text-sm">苏式特调</span>
<span class="text-xs text-on-surface-variant">品尝过 2 款酒饮</span>
</div>
</div>
</section>
</main>
<!-- Bottom Action Button -->
<div class="fixed bottom-0 left-0 w-full p-6 z-50 pointer-events-none">
<button class="pointer-events-auto w-full h-16 rounded-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold text-lg flex items-center justify-center gap-3 shadow-[0_0_30px_rgba(255,191,0,0.3)] active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="chat_bubble" data-weight="fill" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
            开启对话
        </button>
</div>
<!-- Background Decoration -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<div class="absolute top-1/4 -right-20 w-80 h-80 bg-secondary/10 blur-[100px] rounded-full"></div>
<div class="absolute bottom-1/4 -left-20 w-96 h-96 bg-primary/5 blur-[120px] rounded-full"></div>
</div>
</body></html>
